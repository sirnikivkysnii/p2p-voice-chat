<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>P2P Голосовой чат</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root {
    --base: #1e1e2e;
    --mantle: #181825;
    --crust: #11111b;
    --surface: #313244;
    --text: #cdd6f4;
    --subtext: #a6adc8;
    --mauve: #cba6f7;
    --blue: #89b4fa;
    --green: #a6e3a1;
    --green-dark: #40a02b;
    --red: #f38ba8;
    --red-dark: #d20f39;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: radial-gradient(1200px 600px at 50% -10%, #313244 0%, var(--crust) 60%);
    background-color: var(--crust);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 460px;
    background: var(--mantle);
    border: 1px solid var(--surface);
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  h1 {
    font-size: 22px;
    text-align: center;
    margin-bottom: 6px;
  }
  h1 span { color: var(--mauve); }
  .subtitle {
    text-align: center;
    color: var(--subtext);
    font-size: 13px;
    margin-bottom: 22px;
  }
  .label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--subtext);
    margin-bottom: 8px;
    display: block;
  }
  .id-row {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
  }
  #ownId {
    flex: 1;
    background: var(--crust);
    border: 1px solid var(--surface);
    border-radius: 10px;
    padding: 12px;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 13px;
    color: var(--blue);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    user-select: all;
  }
  button {
    cursor: pointer;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    font-size: 14px;
    transition: transform .05s ease, filter .15s ease;
  }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  #copyBtn {
    background: var(--surface);
    color: var(--text);
    padding: 0 16px;
    white-space: nowrap;
  }
  #copyBtn:hover { filter: brightness(1.2); }
  #remoteIdInput {
    width: 100%;
    background: var(--crust);
    border: 1px solid var(--surface);
    border-radius: 10px;
    padding: 12px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    margin-bottom: 18px;
    font-family: ui-monospace, Consolas, monospace;
  }
  #remoteIdInput:focus { border-color: var(--mauve); }
  .btn-row { display: flex; gap: 10px; }
  #callBtn {
    flex: 1;
    background: var(--green);
    color: #11111b;
    padding: 13px;
  }
  #callBtn:hover:not(:disabled) { filter: brightness(1.05); }
  #hangupBtn {
    flex: 1;
    background: var(--red);
    color: #11111b;
    padding: 13px;
  }
  #hangupBtn:hover { filter: brightness(1.05); }
  .hidden { display: none !important; }
  #status {
    margin-top: 18px;
    background: var(--crust);
    border: 1px solid var(--surface);
    border-radius: 10px;
    padding: 12px;
    font-size: 14px;
    text-align: center;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--blue);
    flex-shrink: 0;
  }
  .dot.pulse { animation: pulse 1.2s infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .3; }
  }
  .hint {
    margin-top: 14px;
    font-size: 12px;
    color: var(--subtext);
    text-align: center;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <main class="card">
    <h1>🎙️ P2P <span>Звонилка</span></h1>
    <p class="subtitle">Бесплатный голосовой чат без сервера · WebRTC + PeerJS</p>

    <label class="label" for="ownId">Твой ID</label>
    <div class="id-row">
      <div id="ownId">Генерация…</div>
      <button id="copyBtn" type="button" disabled>Скопировать ID</button>
    </div>

    <label class="label" for="remoteIdInput">ID друга</label>
    <input id="remoteIdInput" type="text" placeholder="Вставь ID друга сюда" autocomplete="off" spellcheck="false" />

    <div class="btn-row">
      <button id="callBtn" type="button" disabled>📞 Позвонить</button>
      <button id="hangupBtn" type="button" class="hidden">🔴 Положить трубку</button>
    </div>

    <div id="status"><span class="dot pulse"></span><span id="statusText">Подключение к сети…</span></div>

    <p class="hint">Отправь свой ID другу.<br />Для разговора нужен микрофон и интернет.</p>
  </main>

<script>
(function () {
  "use strict";

  var ownIdEl = document.getElementById("ownId");
  var copyBtn = document.getElementById("copyBtn");
  var remoteIdInput = document.getElementById("remoteIdInput");
  var callBtn = document.getElementById("callBtn");
  var hangupBtn = document.getElementById("hangupBtn");
  var statusTextEl = document.getElementById("statusText");

  var peer = null;
  var localStream = null;
  var activeCall = null;
  var activeConn = null;
  var remoteAudio = null;

  function setStatus(text) {
    statusTextEl.textContent = text;
  }

  function setInCall(inCall) {
    if (inCall) {
      hangupBtn.classList.remove("hidden");
      callBtn.classList.add("hidden");
      remoteIdInput.disabled = true;
    } else {
      hangupBtn.classList.add("hidden");
      callBtn.classList.remove("hidden");
      remoteIdInput.disabled = false;
      // Кнопку вызова включаем только если микрофон готов
      callBtn.disabled = !localStream;
    }
  }

  function playRemoteStream(remoteStream) {
    stopRemoteAudio();
    remoteAudio = new Audio();
    remoteAudio.autoplay = true;
    remoteAudio.srcObject = remoteStream;
    var playPromise = remoteAudio.play();
    if (playPromise && typeof playPromise.catch === "function") {
      playPromise.catch(function () {
        setStatus("Нажми в любом месте страницы, чтобы включить звук");
        var enableOnce = function () {
          if (remoteAudio) {
            remoteAudio.play().catch(function () {});
          }
          document.removeEventListener("click", enableOnce);
        };
        document.addEventListener("click", enableOnce);
      });
    }
  }

  function stopRemoteAudio() {
    if (remoteAudio) {
      try { remoteAudio.pause(); } catch (e) {}
      try { remoteAudio.srcObject = null; } catch (e) {}
      remoteAudio = null;
    }
  }

  function cleanupCall() {
    if (activeCall) {
      try { activeCall.close(); } catch (e) {}
      activeCall = null;
    }
    if (activeConn) {
      try { activeConn.close(); } catch (e) {}
      activeConn = null;
    }
    stopRemoteAudio();
    setInCall(false);
  }

  function endCall(message) {
    cleanupCall();
    setStatus(message);
  }

  function setupCallHandlers(call) {
    activeCall = call;
    setInCall(true);

    call.on("stream", function (remoteStream) {
      playRemoteStream(remoteStream);
      setStatus("В разговоре");
    });

    // Собеседник положил трубку — PeerJS закрывает звонок и у нас
    call.on("close", function () {
      endCall("Звонок завершён");
    });

    call.on("error", function () {
      endCall("Ошибка звонка");
    });
  }

  function setupDataHandlers(conn) {
    activeConn = conn;
    conn.on("data", function (data) {
      if (data === "hangup") {
        endCall("Собеседник завершил звонок");
      }
    });
    conn.on("close", function () {
      if (activeConn === conn) {
        activeConn = null;
      }
    });
    conn.on("error", function () {
      if (activeConn === conn) {
        activeConn = null;
      }
    });
  }

  function openDataConnection(remoteId) {
    try {
      var conn = peer.connect(remoteId, { reliable: true });
      conn.on("open", function () {
        setupDataHandlers(conn);
      });
      // Если соединение не открылось, всё равно слушаем hangup
      conn.on("error", function () {});
    } catch (e) {
      // Дата-канал необязателен: голос идёт через MediaConnection
    }
  }

  function makeCall() {
    var remoteId = remoteIdInput.value.trim();
    if (!remoteId) {
      setStatus("Введи ID друга");
      return;
    }
    if (!peer || peer.destroyed) {
      setStatus("Нет подключения к сети, обнови страницу");
      return;
    }
    if (!localStream) {
      setStatus("Разрешите доступ к микрофону");
      initMicrophone();
      return;
    }
    if (activeCall) {
      return;
    }
    if (remoteId === peer.id) {
      setStatus("Нельзя позвонить самому себе");
      return;
    }

    setStatus("Звонок…");
    var call = null;
    try {
      call = peer.call(remoteId, localStream);
    } catch (e) {
      setStatus("Не удалось позвонить");
      return;
    }
    if (!call) {
      setStatus("Не удалось позвонить: проверь ID друга");
      return;
    }
    openDataConnection(remoteId);
    setupCallHandlers(call);
  }

  function hangup() {
    // Уведомляем вторую сторону по дата-каналу,
    // чтобы её интерфейс тоже вернулся в исходное состояние
    if (activeConn && activeConn.open) {
      try { activeConn.send("hangup"); } catch (e) {}
    }
    endCall("Звонок завершён");
  }

  function onIncomingCall(call) {
    // Если уже разговариваем — отклоняем второй звонок
    if (activeCall) {
      try { call.close(); } catch (e) {}
      return;
    }
    if (!localStream) {
      // Микрофон ещё не готов — пробуем получить и потом ответить
      setStatus("Входящий звонок… получаем микрофон");
      initMicrophone(function () {
        if (!localStream) {
          try { call.close(); } catch (e) {}
          setStatus("Нет доступа к микрофону");
          return;
        }
        answerCall(call);
      });
      return;
    }
    answerCall(call);
  }

  function answerCall(call) {
    try {
      call.answer(localStream);
    } catch (e) {
      setStatus("Не удалось ответить на звонок");
      return;
    }
    setStatus("Входящий звонок…");
    setupCallHandlers(call);
  }

  function initMicrophone(done) {
    if (localStream) {
      callBtn.disabled = false;
      if (typeof done === "function") { done(); }
      return;
    }
    setStatus("Разрешите доступ к микрофону");
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus("Браузер не поддерживает микрофон");
      if (typeof done === "function") { done(); }
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio: true, video: false })
      .then(function (stream) {
        localStream = stream;
        callBtn.disabled = false;
        if (!activeCall) {
          setStatus("Готов к звонку. Введи ID друга");
        }
        if (typeof done === "function") { done(); }
      })
      .catch(function () {
        setStatus("Нет доступа к микрофону. Разреши доступ и обнови страницу");
        callBtn.disabled = true;
        if (typeof done === "function") { done(); }
      });
  }

  function initPeer() {
    setStatus("Подключение к сети…");
    try {
      peer = new Peer();
    } catch (e) {
      setStatus("Не удалось подключиться к сети");
      return;
    }

    peer.on("open", function (id) {
      ownIdEl.textContent = id;
      copyBtn.disabled = false;
      initMicrophone();
    });

    peer.on("call", onIncomingCall);

    peer.on("connection", function (conn) {
      conn.on("open", function () {
        setupDataHandlers(conn);
      });
      conn.on("data", function (data) {
        if (data === "hangup") {
          endCall("Собеседник завершил звонок");
        }
      });
    });

    peer.on("disconnected", function () {
      setStatus("Соединение потеряно. Переподключение…");
      try { peer.reconnect(); } catch (e) {}
    });

    peer.on("close", function () {
      setStatus("Отключено от сети");
    });

    peer.on("error", function (err) {
      var type = err && err.type ? err.type : "";
      if (type === "peer-unavailable") {
        endCall("Абонент не найден. Проверь ID друга");
      } else if (type === "network" || type === "server-error" || type === "socket-error" || type === "socket-closed") {
        setStatus("Ошибка сети. Обнови страницу");
      } else if (type === "browser-incompatible") {
        setStatus("Браузер не поддерживает звонки");
      } else if (type === "invalid-id" || type === "unavailable-id") {
        setStatus("Ошибка идентификатора");
      } else {
        if (!activeCall) {
          setStatus("Ошибка: " + type);
        }
      }
    });
  }

  copyBtn.addEventListener("click", function () {
    var id = ownIdEl.textContent.trim();
    if (!id || id === "Генерация…") {
      return;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(id).then(function () {
        var old = copyBtn.textContent;
        copyBtn.textContent = "Скопировано!";
        setTimeout(function () { copyBtn.textContent = old; }, 1500);
      }).catch(function () {
        fallbackCopy(id);
      });
    } else {
      fallbackCopy(id);
    }
  });

  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    var old = copyBtn.textContent;
    copyBtn.textContent = "Скопировано!";
    setTimeout(function () { copyBtn.textContent = old; }, 1500);
  }

  callBtn.addEventListener("click", makeCall);
  hangupBtn.addEventListener("click", hangup);

  remoteIdInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      makeCall();
    }
  });

  window.addEventListener("beforeunload", function () {
    if (activeConn && activeConn.open) {
      try { activeConn.send("hangup"); } catch (e) {}
    }
  });

  initPeer();
})();
</script>
</body>
</html>
